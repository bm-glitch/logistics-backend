server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      # 요청서 첨부파일 업로드 용량 한도 (기본 1MB/10MB는 너무 작아서 늘림)
      max-file-size: 15MB
      max-request-size: 50MB
  datasource:
    # Railway가 주는 DATABASE_URL은 postgres://user:pass@host:port/db 형태라
    # Spring이 바로 못 읽어서 JDBC 형식으로 변환해서 env로 넘겨줄 거야 (README 참고).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none      # 스키마는 schema.sql로 직접 관리 (자동생성 금지 — 운영 DB 안전)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

slack:
  bot-token: ${SLACK_BOT_TOKEN:}
  signing-secret: ${SLACK_SIGNING_SECRET:}

ezadmin:
  partner-key: ${EZADMIN_PARTNER_KEY:}
  domain-key: ${EZADMIN_DOMAIN_KEY:}

logging:
  level:
    com.wingbling.logistics: INFO
